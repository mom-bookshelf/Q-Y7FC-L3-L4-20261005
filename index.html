<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能隨機抽題測驗系統</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 24px 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      color: #111827;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 16px;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background-color: #fff;
      transition: all 0.2s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    /* ====== 多選下拉選單樣式 ====== */
    .multi-select-container {
      position: relative;
      width: 100%;
    }
    .multi-select-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .multi-select-header:hover {
      border-color: #a5b4fc;
    }
    .multi-select-header .arrow {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .multi-select-container.active .multi-select-header .arrow {
      transform: rotate(180deg);
    }
    .multi-select-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      z-index: 100;
      margin-top: 4px;
      max-height: 250px;
      display: flex;
      flex-direction: column;
    }
    .multi-select-dropdown.hidden {
      display: none;
    }
    .multi-select-actions {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background-color: #f9fafb;
      border-radius: 8px 8px 0 0;
    }
    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      flex: 1;
      font-weight: 600;
      color: var(--text);
      transition: all 0.2s;
    }
    .btn-sm:hover {
      background: #e5e7eb;
    }
    .multi-select-options {
      overflow-y: auto;
      padding: 8px;
    }
    .multi-select-option {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .multi-select-option:hover {
      background-color: #f3f4f6;
    }
    .multi-select-option input[type="checkbox"] {
      margin-right: 10px;
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .multi-select-option span {
      font-size: 14px;
      color: var(--text);
    }
    /* ==================================== */

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn:active { transform: scale(0.99); }
    
    .btn-secondary {
      background-color: #4b5563;
    }
    .btn-secondary:hover { background-color: #374151; }

    .q-card {
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }
    .q-card:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .q-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      background-color: #e0e7ff;
      color: #3730a3;
    }

    .q-title {
      font-size: 17px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 14px;
      white-space: pre-line;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      background-color: #fff;
    }

    .option-item:hover {
      border-color: #a5b4fc;
      background-color: #f8fafc;
    }

    .option-item input[type="radio"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .option-text {
      font-size: 15px;
      color: #374151;
    }

    .hidden { display: none !important; }

    .score-banner {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .score-num {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      margin-top: 6px;
    }

    .explain-box {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .explain-correct {
      background-color: var(--success-bg);
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .explain-wrong {
      background-color: var(--danger-bg);
      border: 1px solid #fecaca;
      color: #991b1b;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📝 互動式隨機測驗系統</h1>
  </div>

  <!-- 1. 設定與抽題區塊 -->
  <div class="card" id="setupCard">
    <div class="card-title">🎯 1. 選擇出題條件</div>
    
    <div class="grid-3">
      <div class="form-group">
        <label>課次／單元 (可複選)：</label>
        <div class="multi-select-container" id="lessonMultiSelect">
          <div class="multi-select-header" onclick="toggleMultiSelect('lesson')">
            <span id="lessonSelectText">請選擇課次 (預設全部)</span>
            <span class="arrow">▼</span>
          </div>
          <div class="multi-select-dropdown hidden" id="lessonDropdown">
            <div class="multi-select-actions">
              <button type="button" class="btn-sm" onclick="selectAllLessons(event)">全選</button>
              <button type="button" class="btn-sm btn-secondary" onclick="clearAllLessons(event)">清除</button>
            </div>
            <div class="multi-select-options" id="lessonOptionsContainer">
              <!-- 動態生成 checkbox -->
            </div>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="diffSelect">難度：</label>
        <select id="diffSelect"></select>
      </div>
      
      <div class="form-group">
        <label for="questionCount">抽題數量：</label>
        <input type="number" id="questionCount" min="1" value="5">
      </div>
    </div>

    <button class="btn" onclick="startQuiz()">開始隨機測驗</button>
  </div>

  <!-- 2. 測驗進行區塊 -->
  <div class="card hidden" id="quizCard">
    <div class="card-title">✏️ 2. 請開始作答</div>
    <form id="quizForm"></form>
    <button class="btn" style="margin-top: 20px;" onclick="submitQuiz()">確認交卷</button>
  </div>

  <!-- 3. 結果與詳解區塊 -->
  <div class="card hidden" id="resultCard">
    <div class="score-banner">
      <div>測驗完成得分</div>
      <div class="score-num" id="scoreDisplay">0</div>
    </div>

    <div class="card-title">📊 題目結算與詳解</div>
    <div id="resultList"></div>

    <button class="btn btn-secondary" style="margin-top: 24px;" onclick="resetQuiz()">返回重新抽題</button>
  </div>
</div>

<script>

（Ｄ）早期社會民風純樸，智識未開；現代社會資訊發達，有樣學樣。

七年級/國語/康軒/第三課　吃冰的滋味 基礎
「單就口味而言」句中的「單」字意思是「僅、只」，下列何者與之相同？

「莊子釣於濮水，楚王使大夫二人往先焉，曰：『願以境內累矣（【注釋】（１）願以境內累矣：希望勞煩您協助國事。）！』莊子持竿不顧，曰：『吾聞楚有神龜，死已三千歲矣，王巾笥（【注釋】（２）笥：放物品的竹器。）而藏之廟堂之上。此龜者，寧其死為留骨而貴乎，寧其生而曳尾於塗中乎？』二大夫曰：『寧生而曳尾塗中。』莊子曰：『往矣！吾將曳尾於塗中。』」根據這段文字，下列何者與莊子的想法最接近？
（Ａ）人死留名，虎死留皮

（Ｃ）神龜雖壽，猶有竟時

詳解：題幹出自《莊子．外篇．秋水》。由「往矣！吾將曳尾於塗中」可知，莊子寧可像一隻烏龜拖著尾巴在泥路中活著，也不願被高官厚祿所束縛，故選（Ｂ）。（Ａ）比喻人死後留美名於後世　（Ｃ）指神龜雖能長壽，但也有死亡的時候　（Ｄ）寧願因為仗義執言而死，也不選擇沉默而苟且偷生    【語譯】莊子在濮水邊釣魚，楚王派遣兩位大夫前往拜訪，說：「希望勞煩您協助國事！」莊子拿著釣竿沒有回頭，說：「我聽說楚國有神龜，已經死了三千年了，楚王用布帛將牠包好，放在竹器中珍藏在宗廟裡。這隻神龜，是寧願為了留下骨骸以顯示尊貴而死，還是寧願活著而拖著尾巴在泥路中爬行呢？」兩位大夫說：「寧願活著而拖著尾巴在泥路中爬行。」莊子說：「你們回去吧！我將拖著尾巴在泥路中爬行。」

七年級/國語/康軒/第四課　差不多先生傳 基礎
「閒暇時，不曾留心；倉卒時，措手不及。胡亂支吾，任其成敗，或悔或不悔，事過後依然如昨。世之人如此者多矣。」這句話的用意，在提醒世人行事之際應注意下列何者？
（Ａ）宜未雨綢繆，勿因循苟且
（Ｂ）接受失敗，後悔無濟於事
（Ｃ）能當機立斷，可少怨寡悔
（Ｄ）隨機應變，成敗無需掛懷。【101基本學測】
答案：（Ａ）宜未雨綢繆，勿因循苟且
詳解：題幹意謂世上大多數的人平日對小事總不加留心，一旦發生變故便不知如何處理，無論是否感到悔恨，待事過境遷則又依然如故，故選（Ａ）。（Ａ）未雨綢繆：比喻事先預備，防患未然。因循苟且：延續舊習，敷衍草率，不思改革　（Ｂ）無濟於事：對事情沒有任何幫助　（Ｃ）當機立斷：抓住時機，立刻作出決斷　（Ｄ）隨機應變：臨事能妥善變通處置



`;

  // 洗牌 (Fisher-Yates)
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 解析題庫
  function autoParseBank() {
    const rawText = questionBankData.trim();
    if (!rawText) return;

    const blocks = rawText.split(/(?:\r?\n){2,}|---/);
    parsedBank = [];

    blocks.forEach(block => {
      const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length < 3) return;

      const header = lines[0];
      const parts = header.split(/\s+/).filter(Boolean);
      let diff = '未指定';
      let lesson = header;

      if (parts.length >= 2) {
        const last = parts[parts.length - 1];
        if (['基礎', '中等', '進階', '易', '中', '難'].includes(last)) {
          diff = last === '易' ? '基礎' : last === '中' ? '中等' : last === '難' ? '進階' : last;
          lesson = parts.slice(0, -1).join(' ').trim();
        }
      }

      let questionText = '';
      let optionLines = [];
      let answerKey = '';
      let explanation = '無詳解說明。';

      const optPattern = /^[（(][ＡＢＣＤABCD][）)]/;

      lines.slice(1).forEach(line => {
        if (line.startsWith('答案：') || line.startsWith('答案:')) {
          answerKey = line.replace(/^答案[:：]/, '').trim();
        } else if (line.startsWith('詳解：') || line.startsWith('詳解:')) {
          explanation = line.replace(/^詳解[:：]/, '').trim();
        } else if (optPattern.test(line)) {
          optionLines.push(line);
        } else if (optionLines.length === 0) {
          questionText += (questionText ? '\n' : '') + line;
        }
      });

      const options = optionLines.map(line => {
        const label = line.match(optPattern)[0];
        const content = line.replace(optPattern, '').trim();
        return { originalLabel: label, content };
      });

      const ansMatch = answerKey.match(/[（(]\s*([ＡＢＣＤABCD])\s*[）)]/);
      const answerLetter = ansMatch ? ansMatch[1].toUpperCase() : '';

      if (!answerLetter || /有兩個答案/.test(questionText)) return;

      if (questionText && options.length > 0) {
        parsedBank.push({
          lesson,
          diff,
          question: questionText,
          options,
          answerLetter,
          explanation
        });
      }
    });

    updateDropdowns();
  }

  // 更新下拉選單與多選清單
  function updateDropdowns() {
    const lessons = [...new Set(parsedBank.map(q => q.lesson))].sort();
    const diffs = ['全部難度', ...new Set(parsedBank.map(q => q.diff))];

    const dSelect = document.getElementById('diffSelect');
    dSelect.innerHTML = diffs.map(d => `<option value="${d}">${d}</option>`).join('');

    const optionsContainer = document.getElementById('lessonOptionsContainer');
    let html = `
      <label class="multi-select-option">
        <input type="checkbox" value="全部" onchange="handleLessonChange('全部', this.checked)">
        <span>全部課次</span>
      </label>
    `;
    
    lessons.forEach(l => {
      const safeLesson = l.replace(/'/g, "\\'");
      html += `
        <label class="multi-select-option">
          <input type="checkbox" value="${safeLesson}" onchange="handleLessonChange('${safeLesson}', this.checked)">
          <span>${l}</span>
        </label>
      `;
    });
    
    optionsContainer.innerHTML = html;

    selectedLessons = ['全部'];
    updateLessonSelectText();
  }

  // ====== 多選下拉選單控制邏輯 ======
  function toggleMultiSelect(id) {
    const container = document.getElementById(id + 'MultiSelect');
    const dropdown = document.getElementById(id + 'Dropdown');
    container.classList.toggle('active');
    dropdown.classList.toggle('hidden');
  }

  document.addEventListener('click', function(e) {
    const container = document.getElementById('lessonMultiSelect');
    if (container && !container.contains(e.target)) {
      container.classList.remove('active');
      document.getElementById('lessonDropdown').classList.add('hidden');
    }
  });

  function handleLessonChange(lesson, isChecked) {
    if (lesson === '全部') {
      if (isChecked) {
        selectedLessons = ['全部'];
        document.querySelectorAll('#lessonOptionsContainer input[type="checkbox"]').forEach(cb => {
          if (cb.value !== '全部') cb.checked = false;
        });
      } else {
        selectedLessons = [];
      }
    } else {
      if (isChecked) {
        selectedLessons = selectedLessons.filter(l => l !== '全部');
        selectedLessons.push(lesson);
        document.querySelector('#lessonOptionsContainer input[value="全部"]').checked = false;
      } else {
        selectedLessons = selectedLessons.filter(l => l !== lesson);
      }
    }
    
    if (selectedLessons.length === 0) {
      selectedLessons = ['全部'];
      document.querySelector('#lessonOptionsContainer input[value="全部"]').checked = true;
    }
    
    updateLessonSelectText();
  }

  function selectAllLessons(e) {
    e.stopPropagation();
    const allLessons = ['全部', ...[...new Set(parsedBank.map(q => q.lesson))].sort()];
    selectedLessons = allLessons;
    document.querySelectorAll('#lessonOptionsContainer input[type="checkbox"]').forEach(cb => cb.checked = true);
    updateLessonSelectText();
  }

  function clearAllLessons(e) {
    e.stopPropagation();
    selectedLessons = [];
    document.querySelectorAll('#lessonOptionsContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
    handleLessonChange('dummy', false); 
  }

  function updateLessonSelectText() {
    const textEl = document.getElementById('lessonSelectText');
    if (selectedLessons.includes('全部') || selectedLessons.length === 0) {
      textEl.textContent = '全部課次';
    } else if (selectedLessons.length <= 2) {
      textEl.textContent = selectedLessons.join('、');
    } else {
      textEl.textContent = `已選擇 ${selectedLessons.length} 個課次`;
    }
  }
  // ====================================

  function startQuiz() {
    const selectedDiff = document.getElementById('diffSelect').value;
    const countInput = parseInt(document.getElementById('questionCount').value) || 5;

    let pool = parsedBank.filter(item => {
      const matchLesson = selectedLessons.includes('全部') || selectedLessons.length === 0 || selectedLessons.includes(item.lesson);
      const matchDiff = selectedDiff === '全部難度' || item.diff === selectedDiff;
      return matchLesson && matchDiff;
    });

    if (pool.length === 0) {
      alert('⚠️ 沒有符合所選條件的題目，請重新選擇課次或難度！');
      return;
    }

    pool = shuffle(pool);
    currentQuestions = pool.slice(0, Math.min(countInput, pool.length));

    const stdLabels = ['（Ａ）', '（Ｂ）', '（Ｃ）', '（Ｄ）'];

    currentQuestions = currentQuestions.map(q => {
      const correctOpt = q.options.find(
        opt => opt.originalLabel.replace(/[（()）\s]/g, '').toUpperCase() === q.answerLetter
      );
      const correctContent = correctOpt ? correctOpt.content : '';

      const shuffledOpts = shuffle(q.options);
      const randomizedOptions = shuffledOpts.map((opt, idx) => ({
        label: stdLabels[idx] || `（${idx + 1}）`,
        content: opt.content,
        isCorrect: opt.content === correctContent
      }));

      return { ...q, randomizedOptions };
    });

    renderQuizForm();
  }

  function renderQuizForm() {
    document.getElementById('setupCard').classList.add('hidden');
    document.getElementById('resultCard').classList.add('hidden');
    document.getElementById('quizCard').classList.remove('hidden');

    const form = document.getElementById('quizForm');
    form.innerHTML = '';

    currentQuestions.forEach((q, qIdx) => {
      const qDiv = document.createElement('div');
      qDiv.className = 'q-card';

      const optionsHtml = q.randomizedOptions.map((opt, oIdx) => `
        <label class="option-item">
          <input type="radio" name="q_${qIdx}" value="${oIdx}">
          <span class="option-text"><strong>${opt.label}</strong> ${opt.content}</span>
        </label>
      `).join('');

      qDiv.innerHTML = `
        <div class="q-tags">
          <span class="badge">${q.lesson}</span>
        </div>
        <div class="q-title">${qIdx + 1}. ${q.question}</div>
        <div class="option-list">${optionsHtml}</div>
      `;
      form.appendChild(qDiv);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function submitQuiz() {
    let score = 0;
    const resultList = document.getElementById('resultList');
    resultList.innerHTML = '';

    currentQuestions.forEach((q, qIdx) => {
      const selected = document.querySelector(`input[name="q_${qIdx}"]:checked`);
      const userChoiceIndex = selected ? parseInt(selected.value) : -1;

      const correctOpt = q.randomizedOptions.find(o => o.isCorrect);
      const userOpt = userChoiceIndex !== -1 ? q.randomizedOptions[userChoiceIndex] : null;

      const isCorrect = !!(userOpt && userOpt.isCorrect);
      if (isCorrect) score++;

      const resDiv = document.createElement('div');
      resDiv.className = 'q-card';

      const statusClass = isCorrect ? 'explain-correct' : 'explain-wrong';
      const userText = userOpt ? `${userOpt.label} ${userOpt.content}` : '未作答';
      const correctText = correctOpt
        ? `${correctOpt.label} ${correctOpt.content}`
        : '（題庫答案對應失敗）';

      resDiv.innerHTML = `
        <div class="q-tags">
          <span class="badge">${q.lesson}</span>
        </div>
        <div class="q-title">${qIdx + 1}. ${q.question}</div>

        <div class="explain-box ${statusClass}">
          <div><strong>你的作答：</strong>${userText} ${isCorrect ? '✅ (正確)' : '❌ (錯誤)'}</div>
          ${!isCorrect ? `<div><strong>正確答案：</strong>${correctText}</div>` : ''}
          <div style="margin-top: 6px; font-weight: 600;">【詳解】</div>
          <div>${q.explanation}</div>
        </div>
      `;
      resultList.appendChild(resDiv);
    });

    const total = currentQuestions.length;
    const finalScore = total ? Math.round((score / total) * 100) : 0;
    document.getElementById('scoreDisplay').innerText = `${finalScore} 分 (${score}/${total}題)`;

    document.getElementById('quizCard').classList.add('hidden');
    document.getElementById('resultCard').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetQuiz() {
    document.getElementById('resultCard').classList.add('hidden');
    document.getElementById('setupCard').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = function () {
    autoParseBank();
  };
</script>
